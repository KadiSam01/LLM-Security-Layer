version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    deploy: {}
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  orchestrator:
    build:
      context: ./Orchestrator
      dockerfile: dockerfile       # ✅ explicitly use lowercase
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=llama2:7b
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      #- DEFAULT_MODEL=llama2-uncensored
    depends_on:
      - ollama
    runtime: nvidia
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/dockerfile
    ports:
      - "80:80"
    depends_on:
      - orchestrator

volumes:
  ollama:

# docker-compose.yml (at repo root)
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama

  orchestrator:
    build:
      context: ./Orchestrator
      dockerfile: dockerfile   # keep your lowercase file name
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=llama3.2:3b
    depends_on:
      - ollama

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/dockerfile
    ports:
      - "80:80"
    depends_on:
      - orchestrator

volumes:
  ollama:
